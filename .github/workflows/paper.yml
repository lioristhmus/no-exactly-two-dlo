name: Frozen paper package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify historical paper-rc1
        working-directory: release/paper-rc1
        run: |
          sha256sum -c SHA256SUMS
          python3 lint_paper.py
          python3 check_formalization_index.py
      - name: Verify active paper-rc2
        working-directory: release/paper-rc2
        run: |
          sha256sum -c SHA256SUMS
          python3 lint_paper.py
          python3 check_formalization_index.py --final
      - name: Verify root convenience copies
        run: |
          cmp no-exactly-two-dlo.md release/paper-rc2/no-exactly-two-dlo.md
          cmp no-exactly-two-dlo.pdf release/paper-rc2/build/no-exactly-two-dlo.pdf
          cmp formalization-index.md release/paper-rc2/formalization-index.md
          cmp formalization-index.json release/paper-rc2/formalization-index.json
